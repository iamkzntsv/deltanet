defaults:
  - model: deltanet
  - training: default
  - _self_

seed: 42
objective: language_modeling
ckpt_dir: outputs/2026-11-09/20-06-53/checkpoints

hydra:
  run:
    dir: "outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  job_logging:
    loggers:
      absl:
        level: INFO
        handlers: [file]
        propagate: false
      orbax:
        level: INFO
        handlers: [file]
        propagate: false
