# @package _global_
defaults:
  - override /training: short

objective: associative_recall

data:
  vocab_size: 8192
  num_kv_pairs: 64
  num_train_examples: 100_000
  num_test_examples: 10_000

training:
  num_steps: 10_000
  batch_size: 32

model:
  model:
    embed_dim: 128

hydra:
  run:
    dir: outputs/mqar/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/mqar/sweep/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  sweeper:
    params:
      model.model.embed_dim: 64, 128, 256
      training.optimizer.lr.peak_value: 1e-4,4.6e-4,2.2e-3,1e-2
