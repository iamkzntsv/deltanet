# @package _global_
defaults:
  - override /training: short

seed: 1

data:
  vocab_size: 256 # 8192
  seq_len: 64 # 256
  num_kv_pairs: #
  num_train_examples: 100_000
  num_test_examples: 10_000

training:
  num_steps: 1
  batch_size: 32
  optimizer:
    learning_rate: 1.0e-3

model:
  embed_dim: 128

hydra:
  run:
    dir: outputs/mqar/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/mqar/sweep/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  sweeper:
    params:
      model.embed_dim: 64, 128, 256
      training.optimizer.learning_rate: 1e-4,4.6e-4,2.2e-3,1e-2
      data.
